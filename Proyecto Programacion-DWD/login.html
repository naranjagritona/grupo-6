<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar sesión | Academia Integral XXI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h2>Iniciar sesión</h2>
    <form id="loginForm" action="index.html" method="post">
      <label>Usuario<input id="usuario" name="usuario" type="text" required></label>
      <label>Contraseña<input id="contrasena" name="contrasena" type="password" required></label>
      <button type="submit" class="button-primary">Ingresar</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
